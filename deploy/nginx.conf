# 用 nginx 的话必须显式转发 WebSocket 升级头，否则实时同步会退化成连不上。
# 证书用 certbot 签发：sudo certbot --nginx -d zjh.example.com
server {
    listen 443 ssl http2;
    server_name zjh.example.com;

    ssl_certificate     /etc/letsencrypt/live/zjh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zjh.example.com/privkey.pem;

    # 服务端已经在内存里预压缩过静态资源，这里不用再压一遍
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 牌局中的长连接不能被读超时掐掉
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name zjh.example.com;
    return 301 https://$host$request_uri;
}

